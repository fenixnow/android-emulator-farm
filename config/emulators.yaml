# =============================================================================
# Watchdog
# =============================================================================

watchdog:
  poll_interval_sec: 30
  boot_timeout_sec: 180
  adb_timeout_sec: 5
  max_restart_attempts: 3
  restart_cron: "0 5 * * *"
  auto_create: true
  apk_dir: "apks"
  log_file: logs/watchdog.log
  state_file: logs/state.json
  # автозакрытие zombie-сессий device-farm (OTTE-1939)
  zombie_cleanup:
    enabled: true
    interval_min: 60          # как часто проверять
    max_age_min: 30           # running-сессии старше этого = зомби
    api_base: "http://localhost:4723"
    api_user: "pola"
    api_password_file: "/opt/android-emulator-farm/config/.df-admin-pass"  # 600, в git не хранится
    db_path: "/home/appium/.cache/appium-device-farm/device-farm-latest.db"
