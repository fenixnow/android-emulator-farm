# =============================================================================
# Android Emulator Farm — конфигурация AVD и эмуляторов
# =============================================================================

avds:
  # --- medium_phone ×3: FHD+ (1080×2400, 420dpi) — основной тип (~80% пользователей) ---
  - name: medium_phone_1
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: &hw_medium
      hw.cpu.arch: x86_64
      hw.lcd.width: 1080
      hw.lcd.height: 2400
      hw.lcd.density: 420
      hw.ramSize: 2048
      vm.heapSize: 192
      disk.dataPartition.size: "4G"
      hw.keyboard: "yes"

  - name: medium_phone_2
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_medium

  - name: medium_phone_3
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_medium

  - name: medium_phone_4
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_medium

  - name: medium_phone_5
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_medium

  # --- low_end_phone ×3: HD+ (720×1600, 320dpi) — для проверки регрессий ---
  - name: low_end_phone_1
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: &hw_low
      hw.cpu.arch: x86_64
      hw.lcd.width: 720
      hw.lcd.height: 1600
      hw.lcd.density: 320
      hw.ramSize: 1536
      vm.heapSize: 128
      disk.dataPartition.size: "2G"
      hw.keyboard: "yes"

  - name: low_end_phone_2
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_low

  - name: low_end_phone_3
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_low

  - name: low_end_phone_4
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_low

  - name: low_end_phone_5
    device: pixel_6
    system_image: "system-images;android-35;google_apis;x86_64"
    sdcard: "512M"
    hw: *hw_low

# =============================================================================
# Эмуляторы (6 шт., чётные порты начиная с 5554)
# =============================================================================

emulators:
  - name: emu1
    avd: medium_phone_1
    port: 5554
    extra_args: "-no-window -no-audio -no-boot-anim -gpu host"
    writable_system: false
    wipe_data: false
    no_snapshot_save: true
    locale: "ru-RU"
    prop:
      ro.product.model: "Medium Phone 1"

